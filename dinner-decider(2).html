  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .board-header{background:var(--board);color:var(--chalk);padding:22px 20px 20px;position:relative;}
  .board-header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--card);border-radius:14px 14px 0 0;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim);margin:0 0 6px;}
  .board-title{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:26px;margin:0;line-height:1.2;}
  .board-sub{font-size:13px;color:var(--chalk-dim);margin:6px 0 0;}
  .content{padding:18px 18px 90px;}
  .card{background:var(--card);border:1px solid var(--card-edge);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card.pin{position:relative;box-shadow:0 1px 0 var(--line);}
  .card.pin::before{content:"";position:absolute;top:10px;right:14px;width:6px;height:6px;border-radius:50%;background:var(--brass);opacity:.7;}
  .btn{font-family:var(--font-body);font-size:15px;font-weight:600;border-radius:11px;border:none;padding:12px 16px;cursor:pointer;text-align:center;transition:transform .08s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brass);color:var(--board);width:100%;}
  .btn-secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line);width:100%;}
  .btn-sage{background:var(--sage);color:#fff;width:100%;}
  .btn-ghost{background:transparent;color:var(--brass-dark);border:none;font-weight:600;padding:8px 4px;}
  .btn-block-row{display:flex;gap:10px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;padding:6px 11px;border-radius:20px;border:1.5px solid var(--line);color:var(--ink-soft);background:#fff;cursor:pointer;user-select:none;}
  .chip.active{background:var(--sage);border-color:var(--sage);color:#fff;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tag{font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:20px;background:var(--sage-light);color:var(--sage);}
  .tag.brick{background:var(--brick-light);color:var(--brick);}
  .tag.brass{background:#EFFAD1;color:var(--brass-dark);}
  .recipe-name{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 4px;}
  .recipe-meta{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .emoji-badge{width:46px;height:46px;border-radius:12px;background:var(--sage-light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  input,select,textarea{font-family:var(--font-body);font-size:15px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;width:100%;color:var(--ink);}
  textarea{resize:vertical;min-height:90px;}
  label.field-label{display:block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:14px 0 6px;}
  .field{margin-bottom:2px;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-icon{font-size:34px;margin-bottom:10px;}
  .empty-title{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:18px;color:var(--ink);margin:0 0 6px;}
  .ing-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .ing-row input{flex:1;}
  .ing-remove{background:none;border:none;color:var(--brick);font-size:18px;cursor:pointer;padding:4px 8px;}
  .ing-status{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  .ing-status:last-child{border-bottom:none;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.have{background:var(--neon);}
  .dot.missing{background:var(--brick);}
  .nav{display:flex;background:var(--board);padding:8px 6px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;border-top:1px solid var(--board-dark);}
  .nav-btn{flex:1;background:none;border:none;color:var(--chalk-dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;font-family:var(--font-body);}
  .nav-btn.active{color:var(--brass);}
  .nav-btn span{font-size:10.5px;font-weight:600;}
  .nav-icon{width:22px;height:22px;}
  .fab{position:absolute;right:20px;bottom:96px;width:52px;height:52px;border-radius:50%;background:var(--brass);color:var(--board);border:none;font-size:26px;box-shadow:0 6px 20px rgba(182,255,60,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .modal-wrap{position:absolute;inset:0;background:rgba(32,43,35,.55);display:flex;align-items:flex-end;z-index:20;}
  .modal{background:var(--card);width:100%;max-height:88%;border-radius:20px 20px 0 0;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
  .modal-title{font-family:var(--font-display);font-weight:700;font-style:italic;font-size:20px;margin:0 0 4px;}
  .close-x{position:absolute;top:16px;right:16px;background:var(--line);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink-soft);cursor:pointer;}
  .feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .feed-item:last-child{border-bottom:none;}
  .feed-icon{width:34px;height:34px;border-radius:50%;background:var(--sage-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .feed-text{font-size:14px;line-height:1.4;}
  .feed-text b{font-weight:700;}
  .feed-time{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .cat-header{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-dark);margin:18px 0 8px;}
  .cat-header:first-child{margin-top:0;}
  .shop-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .shop-row:last-child{border-bottom:none;}
  .shop-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--sage);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .shop-check.checked{background:var(--sage);color:#fff;font-size:12px;}
  .shop-label{flex:1;font-size:14.5px;}
  .shop-label.checked{text-decoration:line-through;color:var(--ink-soft);}
  .shop-from{font-size:11px;color:var(--ink-soft);}
  .identity-screen{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;background:var(--board);color:var(--chalk);}
  .avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--brass);color:var(--board);border:none;font-weight:700;font-size:13px;cursor:pointer;}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:var(--chalk);font-size:13px;padding:10px 16px;border-radius:20px;z-index:30;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .toast.show{opacity:1;}
  .pick-reveal{animation:reveal .35s ease;}
  @keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .muted{color:var(--ink-soft);font-size:13px;}
  @keyframes confettiFall{ to{ transform:translateY(115vh) rotate(220deg); opacity:.15; } }
  .streak-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-family:var(--font-mono);font-size:12px;padding:6px 12px;border-radius:20px;margin-top:10px;}
</style>
</head>

var CATS = ['Produce','Meat & Fish','Dairy & Eggs','Pantry & Dry Goods','Frozen','Household','Other'];
var CAT_KEYWORDS = {
  'Produce':['onion','garlic','tomato','pepper','lettuce','carrot','potato','lemon','lime','herb','basil','cilantro','parsley','spinach','broccoli','apple','banana','avocado','cucumber','ginger','mushroom','celery','fruit','veg'],
  'Meat & Fish':['chicken','beef','pork','lamb','fish','salmon','shrimp','prawn','bacon','sausage','mince','turkey','steak'],
  'Dairy & Eggs':['milk','cheese','butter','cream','yog','egg','parmesan','mozzarella'],
  'Frozen':['frozen','ice cream','peas (frozen)'],
  'Pantry & Dry Goods':['flour','rice','pasta','oil','sugar','salt','spice','sauce','stock','can','tin','bean','lentil','bread','vinegar','honey','stock cube','noodle']
};

function guessCategory(name){
  var n = name.toLowerCase();
  for (var cat in CAT_KEYWORDS){
    var kws = CAT_KEYWORDS[cat];
    for (var i=0;i<kws.length;i++){ if (n.indexOf(kws[i])!==-1) return cat; }
  }
  return 'Other';
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function compressImage(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, hgt = img.height;
        var scale = Math.min(1, maxDim/Math.max(w,hgt));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(hgt*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){ reject(new Error('Could not read image')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Could not read file')); };
    reader.readAsDataURL(file);
  });
}

function relTime(ts){
  var diff = Date.now()-ts;
  var min = Math.floor(diff/60000);
  if (min<1) return 'just now';
  if (min<60) return min+'m ago';
  var hr = Math.floor(min/60);
  if (hr<24) return hr+'h ago';
  var day = Math.floor(hr/24);
  if (day===1) return 'yesterday';
  if (day<7) return day+'d ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function toast(msg){

var appStartTime = Date.now();

function finishLoadingIfReady(){
  if (recipesLoaded && metaLoaded && state.loading){
    state.loading = false;
    render();
  }
}

function notifyIfRemote(newEntries){
  newEntries.forEach(function(a){
    var isMine = state.identity && a.author===state.identity.name;
    var isFresh = (Date.now()-a.ts) < 5*60*1000; // ignore old history on first connect
    var isAfterOpen = a.ts >= appStartTime - 3000;
    if (!isMine && isFresh && isAfterOpen){
      if (a.type==='new_recipe') toast('🔔 '+a.author+' added: '+a.recipeName);
      else if (a.type==='cooked') toast('🔔 '+a.author+' cooked: '+a.recipeName);
      else if (a.type==='edited') toast('🔔 '+a.author+' updated: '+a.recipeName);
    }
  });
}

function load(){
  try{
    var raw = localStorage.getItem('dinner_identity');
    state.identity = raw ? JSON.parse(raw) : null;
  }catch(e){ state.identity = null; }

  onSnapshot(recipesCol, function(snapshot){
    state.recipes = snapshot.docs.map(function(d){ var data = d.data(); data.id = d.id; return data; });
    recipesLoaded = true;
    finishLoadingIfReady();
    if (!state.modal) render();
  }, function(){ recipesLoaded = true; finishLoadingIfReady(); toast('Could not connect — check your internet'); });

  onSnapshot(metaRef, function(docSnap){
    var d = docSnap.exists() ? docSnap.data() : {};
    state.pantry = d.pantry || [];
    var shopping = d.shopping || {};
    CATS.forEach(function(c){ if(!shopping[c]) shopping[c]=[]; });
    state.shopping = shopping;
    var activity = d.activity || [];
    if (seenActivityIds===null){
      seenActivityIds = {};
      activity.forEach(function(a){ seenActivityIds[a.id]=true; });
    } else {
      var fresh = activity.filter(function(a){ return !seenActivityIds[a.id]; });
      fresh.forEach(function(a){ seenActivityIds[a.id]=true; });
      notifyIfRemote(fresh);
    }
    state.activity = activity;
    metaLoaded = true;
    finishLoadingIfReady();
    if (!state.modal) render();
  }, function(){ metaLoaded = true; finishLoadingIfReady(); toast('Could not connect — check your internet'); });
}

}

}
async function saveMeta(){

}

function pushActivity(type, recipeName, note){
  var entry = { id:uid(), type:type, author:state.identity ? state.identity.name : 'Someone', recipeName:recipeName||'', note:note||'', ts:Date.now() };
  state.activity.unshift(entry);
  if (state.activity.length>60) state.activity = state.activity.slice(0,60);
  if (seenActivityIds) seenActivityIds[entry.id] = true;
  saveActivity();
}

function ingredientStatus(recipe){
  var have=[], missing=[];
  var pantryLower = state.pantry.map(function(p){ return p.toLowerCase(); });
  (recipe.ingredients||[]).forEach(function(ing){
    var name = ing.name.toLowerCase();
    var found = pantryLower.some(function(p){ return p===name || name.indexOf(p)!==-1 || p.indexOf(name)!==-1; });
    if (found) have.push(ing); else missing.push(ing);
  });
  return {have:have, missing:missing};
}

function addMissingToShopping(recipe){
  var status = ingredientStatus(recipe);
  var added = 0;
  status.missing.forEach(function(ing){
    var cat = guessCategory(ing.name);
    var exists = state.shopping[cat].some(function(i){ return i.name.toLowerCase()===ing.name.toLowerCase() && !i.checked; });
    if (!exists){ state.shopping[cat].push({id:uid(), name:ing.name, checked:false, from:recipe.name}); added++; }
  });
  saveShopping();
  toast(added ? added+' item'+(added>1?'s':'')+' added to shopping list' : 'Already on your list');
  render();
}

function pickTonight(){
  var pool = state.recipes.slice();
  if (state.tonightFilters.quick) pool = pool.filter(function(r){ return r.prepTime && r.prepTime<=25; });
  if (state.tonightFilters.ready) pool = pool.filter(function(r){ return ingredientStatus(r).missing.length===0; });
  if (pool.length===0){ state.tonightPick=null; render(); return; }
  var weighted = pool.map(function(r){
    var daysSince = r.lastMade ? (Date.now()-r.lastMade)/86400000 : 999;
    var weight = Math.min(daysSince, 60) + 1;
    return {r:r, weight:weight};
  });
  var total = weighted.reduce(function(s,w){return s+w.weight;},0);
  var rnd = Math.random()*total;
  var chosen = weighted[0].r;
  for (var i=0;i<weighted.length;i++){ rnd -= weighted[i].weight; if (rnd<=0){ chosen = weighted[i].r; break; } }
  state.tonightPick = chosen;
  render();
}

function computeStreak(){
  var cookedDays = state.activity.filter(function(a){ return a.type==='cooked'; }).map(function(a){ return new Date(a.ts).toDateString(); });
  var daySet = {};
  cookedDays.forEach(function(d){ daySet[d]=true; });
  var check = new Date(); check.setHours(0,0,0,0);
  if (!daySet[check.toDateString()]) check.setDate(check.getDate()-1);
  var streak = 0;
  while (daySet[check.toDateString()]){
    streak++;
    check.setDate(check.getDate()-1);
  }
  return streak;
}

    var span = document.createElement('span');

    span.style.cssText = 'position:absolute;left:'+(Math.random()*100)+'%;top:-8%;font-size:'+(14+Math.random()*14)+'px;animation:confettiFall '+(1+Math.random()*0.8)+'s ease-in forwards;animation-delay:'+(Math.random()*0.25)+'s;';

}

        '<div style="flex:2;"><label class="field-label">Cuisine</label><input id="f_cuisine" value="'+esc(r.cuisine)+'" placeholder="e.g. Italian"></div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;">'+
        '<div style="flex:1;"><label class="field-label">Prep time (min)</label><input id="f_prep" type="number" value="'+esc(r.prepTime)+'" placeholder="30"></div>'+
        '<div style="flex:1;"><label class="field-label">Difficulty</label><select id="f_diff"><option'+(r.difficulty==='Easy'?' selected':'')+'>Easy</option><option'+(r.difficulty==='Medium'?' selected':'')+'>Medium</option><option'+(r.difficulty==='Hard'?' selected':'')+'>Hard</option></select></div>'+
      '</div>'+
      '<label class="field-label">Ingredients</label><div id="ingList">'+ingHtml+'</div>'+
      '<button class="btn-ghost" id="addIngRow">+ add ingredient</button>'+
      '<label class="field-label">Instructions</label><textarea id="f_instructions" placeholder="Step by step&hellip;">'+esc(r.instructions)+'</textarea>'+
      '<label class="field-label">Notes (optional)</label><textarea id="f_notes" placeholder="Tips, tweaks, serving ideas&hellip;" style="min-height:60px;">'+esc(r.notes||'')+'</textarea>'+
      '<button class="btn btn-primary" id="saveRecipeBtn" style="margin-top:18px;">Save recipe</button>'+
      (state.modal==='editRecipe' ? '<button class="btn btn-secondary" id="deleteRecipeBtn" style="margin-top:10px;">Delete recipe</button>' : '')+
      '</div></div>';
  }
  if (state.modal==='viewRecipe'){
    var rec = state.recipeDetail;
    var status = ingredientStatus(rec);
    var ingHtml2 = status.have.map(function(i){ return '<div class="ing-status"><span class="dot have"></span>'+esc(i.name)+'</div>'; }).join('') +
      status.missing.map(function(i){ return '<div class="ing-status"><span class="dot missing"></span>'+esc(i.name)+'</div>'; }).join('');
    return '<div class="modal-wrap" id="modalWrap"><div class="modal">'+
      '<button class="close-x" id="modalClose">&times;</button>'+
      (rec.photo ? '<img src="'+rec.photo+'" style="width:100%;height:190px;object-fit:cover;border-radius:14px;margin-bottom:12px;">' : '')+
      '<div class="row" style="align-items:flex-start;margin-bottom:6px;">'+
        (rec.photo ? '' : renderThumb(rec,46))+
        '<div><p class="modal-title">'+esc(rec.name)+'</p><p class="recipe-meta">'+esc(rec.cuisine||'')+(rec.prepTime?' &middot; '+rec.prepTime+' min':'')+' &middot; '+esc(rec.difficulty||'')+'</p></div>'+
      '</div>'+
      '<p class="muted">By '+esc(rec.author)+(rec.lastMade?' &middot; last made '+relTime(rec.lastMade):' &middot; never made')+(rec.timesMade?' &middot; cooked '+rec.timesMade+'x':'')+'</p>'+
      '<label class="field-label">Ingredients</label><div class="card" style="padding:4px 14px;">'+ingHtml2+'</div>'+
      '<label class="field-label">Instructions</label><p style="white-space:pre-wrap;line-height:1.6;font-size:14.5px;">'+esc(rec.instructions)+'</p>'+
      (rec.notes ? '<label class="field-label">Notes</label><p style="white-space:pre-wrap;font-size:14px;color:var(--ink-soft);">'+esc(rec.notes)+'</p>' : '')+
      '<div class="btn-block-row" style="margin-top:16px;">'+
        (status.missing.length ? '<button class="btn btn-secondary" id="addMissingDetailBtn">Add missing to list</button>' : '')+
        '<button class="btn btn-sage" id="cookedDetailBtn">Cooked tonight</button>'+
      '</div>'+
      '<button class="btn btn-secondary" id="editDetailBtn" style="margin-top:10px;">Edit</button>'+
      '</div></div>';
  }
  if (state.modal==='changeName'){
    return '<div class="modal-wrap" id="modalWrap"><div class="modal">'+
      '<button class="close-x" id="modalClose">&times;</button>'+
      '<p class="modal-title">Your name</p>'+
      '<input id="f_name2" value="'+esc(state.identity.name)+'" style="margin-top:10px;">'+
      '<button class="btn btn-primary" id="saveNameBtn" style="margin-top:16px;">Save</button>'+
      '</div></div>';
  }
  return '';
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ state.tab = b.getAttribute('data-tab'); state.modal=null; render(); };
  });
  var avatarBtn = document.getElementById('avatarBtn');
  if (avatarBtn) avatarBtn.onclick = function(){ state.modal='changeName'; render(); };

  if (state.tab==='tonight'){
    document.querySelectorAll('[data-filt]').forEach(function(c){
      c.onclick = function(){ var f=c.getAttribute('data-filt'); state.tonightFilters[f]=!state.tonightFilters[f]; state.tonightPick=null; render(); };
    });
    var decideBtn = document.getElementById('decideBtn'); if (decideBtn) decideBtn.onclick = pickTonight;
    var againBtn = document.getElementById('againBtn'); if (againBtn) againBtn.onclick = pickTonight;
    var cookBtn = document.getElementById('cookBtn'); if (cookBtn) cookBtn.onclick = function(){ markCooked(state.tonightPick); };
    var viewBtn = document.getElementById('viewBtn'); if (viewBtn) viewBtn.onclick = function(){ state.recipeDetail = state.tonightPick; state.modal='viewRecipe'; render(); };
    var addMissingBtn = document.getElementById('addMissingBtn'); if (addMissingBtn) addMissingBtn.onclick = function(){ addMissingToShopping(state.tonightPick); };
  }

  if (state.tab==='recipes'){
    var fab = document.getElementById('fabAdd');
    if (fab) fab.onclick = function(){ state.editingRecipe=null; state.modal='addRecipe'; render(); };
    document.querySelectorAll('.recipe-card').forEach(function(c){
      c.onclick = function(){
        var id = c.getAttribute('data-id');
        state.recipeDetail = state.recipes.find(function(r){return r.id===id;});
        state.modal='viewRecipe'; render();
      };
    });
  }

  if (state.tab==='pantry'){
    var pAdd = document.getElementById('pantryAdd');
    var pInput = document.getElementById('pantryInput');
    var addPantry = function(){
      var v = pInput.value.trim();
      if (!v) return;
      state.pantry.push(v);
      savePantry();
      pInput.value='';
      render();
    };
    if (pAdd) pAdd.onclick = addPantry;
    if (pInput) pInput.onkeydown = function(e){ if (e.key==='Enter') addPantry(); };
    document.querySelectorAll('[data-pantry-remove]').forEach(function(btn){
      btn.onclick = function(){
        var v = btn.getAttribute('data-pantry-remove');
        state.pantry = state.pantry.filter(function(p){ return p!==v; });
        savePantry(); render();
      };
    });
  }

  if (state.tab==='list'){
    var sAdd = document.getElementById('shopAdd');
    if (sAdd) sAdd.onclick = function(){
      var input = document.getElementById('shopInput');
      var cat = document.getElementById('shopCat').value;
      var v = input.value.trim();
      if (!v) return;
      state.shopping[cat].push({id:uid(), name:v, checked:false, from:null});
      saveShopping(); input.value=''; render();
    };
    document.querySelectorAll('[data-shop-toggle]').forEach(function(btn){
      btn.onclick = function(){
        var parts = btn.getAttribute('data-shop-toggle').split('|');
        var item = state.shopping[parts[0]].find(function(i){return i.id===parts[1];});
        if (item){ item.checked = !item.checked; saveShopping(); render(); }
      };
    });
    document.querySelectorAll('[data-shop-remove]').forEach(function(btn){
      btn.onclick = function(){
        var parts = btn.getAttribute('data-shop-remove').split('|');
        state.shopping[parts[0]] = state.shopping[parts[0]].filter(function(i){return i.id!==parts[1];});
        saveShopping(); render();
      };
    });
    var clearBtn = document.getElementById('clearChecked');
    if (clearBtn) clearBtn.onclick = function(){
      CATS.forEach(function(c){ state.shopping[c] = state.shopping[c].filter(function(i){return !i.checked;}); });
      saveShopping(); render();
    };
  }

  var modalClose = document.getElementById('modalClose');
  if (modalClose) modalClose.onclick = function(){ state.modal=null; state.editingRecipe=null; render(); };
  var modalWrap = document.getElementById('modalWrap');
  if (modalWrap) modalWrap.onclick = function(e){ if (e.target===modalWrap){ state.modal=null; render(); } };

  var pendingPhoto = (state.editingRecipe && state.editingRecipe.photo) || null;
  var photoInput = document.getElementById('f_photoInput');
  if (photoInput) photoInput.onchange = function(){
    var file = photoInput.files[0];
    if (!file) return;
    var wrap = document.getElementById('photoPreviewWrap');
    wrap.innerHTML = '<p class="muted">Compressing photo&hellip;</p>';
    compressImage(file, 720, 0.7).then(function(dataUrl){
      pendingPhoto = dataUrl;
      wrap.innerHTML = '<img src="'+dataUrl+'" style="width:100%;height:170px;object-fit:cover;border-radius:12px;">';
    }).catch(function(){
      toast('Could not read that photo');
      wrap.innerHTML = '';
    });
  };

  var addIngRow = document.getElementById('addIngRow');
  if (addIngRow) addIngRow.onclick = function(){
    var list = document.getElementById('ingList');
    var id = uid();
    var div = document.createElement('div');
    div.className='ing-row';
    div.innerHTML = '<input class="ing-name" data-ing="'+id+'" placeholder="e.g. 1 tbsp olive oil"><button class="ing-remove" data-ing-remove="'+id+'">&times;</button>';
    list.appendChild(div);
    div.querySelector('.ing-remove').onclick = function(){ div.remove(); };
  };
  document.querySelectorAll('[data-ing-remove]').forEach(function(btn){
    btn.onclick = function(){ btn.parentElement.remove(); };
  });

  var saveRecipeBtn = document.getElementById('saveRecipeBtn');
  if (saveRecipeBtn) saveRecipeBtn.onclick = function(){
    var name = document.getElementById('f_name').value.trim();
    if (!name){ toast('Give the dish a name first'); return; }
    var ingNames = Array.prototype.slice.call(document.querySelectorAll('.ing-name')).map(function(inp){ return inp.value.trim(); }).filter(Boolean);
    var ingredients = ingNames.map(function(n){ return {id:uid(), name:n}; });
    var isEdit = state.modal==='editRecipe';
    var rec = isEdit ? state.editingRecipe : {id:uid(), author:state.identity.name, createdAt:Date.now(), lastMade:null, timesMade:0};
    rec.name = name;
    rec.emoji = document.getElementById('f_emoji').value.trim() || '🍲';
    rec.cuisine = document.getElementById('f_cuisine').value.trim();
    rec.prepTime = parseInt(document.getElementById('f_prep').value,10) || null;
    rec.difficulty = document.getElementById('f_diff').value;
    rec.ingredients = ingredients;
    rec.instructions = document.getElementById('f_instructions').value.trim();
    rec.notes = document.getElementById('f_notes').value.trim();
    rec.photo = pendingPhoto;
    if (!isEdit) state.recipes.push(rec);
    saveRecipeDoc(rec);
    pushActivity(isEdit?'edited':'new_recipe', rec.name);
    state.modal=null; state.editingRecipe=null;
    toast(isEdit?'Recipe updated':'Recipe added to the collection');
    render();
  };

  var deleteRecipeBtn = document.getElementById('deleteRecipeBtn');
  if (deleteRecipeBtn) deleteRecipeBtn.onclick = function(){
    var deletedId = state.editingRecipe.id;
    state.recipes = state.recipes.filter(function(r){ return r.id!==deletedId; });
    deleteRecipeDoc(deletedId);
    state.modal=null; state.editingRecipe=null;
    toast('Recipe deleted');
    render();
  };

  var editDetailBtn = document.getElementById('editDetailBtn');
  if (editDetailBtn) editDetailBtn.onclick = function(){ state.editingRecipe = state.recipeDetail; state.modal='editRecipe'; render(); };
  var cookedDetailBtn = document.getElementById('cookedDetailBtn');
  if (cookedDetailBtn) cookedDetailBtn.onclick = function(){ markCooked(state.recipeDetail); state.modal=null; render(); };
  var addMissingDetailBtn = document.getElementById('addMissingDetailBtn');
  if (addMissingDetailBtn) addMissingDetailBtn.onclick = function(){ addMissingToShopping(state.recipeDetail); };

  var saveNameBtn = document.getElementById('saveNameBtn');
  if (saveNameBtn) saveNameBtn.onclick = function(){
    var v = document.getElementById('f_name2').value.trim();
    if (!v) return;
    state.identity = {name:v};
    saveIdentity();
    state.modal=null; render();
  };
}

function showIntroThenStart(){
  var overlay = document.createElement('div');
  overlay.id = 'introOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:#123B24;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;';
  overlay.innerHTML = '<video id="introVideo" autoplay muted playsinline webkit-playsinline="true" style="width:100%;height:100%;object-fit:cover;"><source src="'+INTRO_VIDEO_SRC+'" type="video/mp4"></video>'+
    '<button id="skipIntroBtn" style="position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:20px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.45);padding:9px 18px;border-radius:20px;font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;">Skip</button>';
  document.body.appendChild(overlay);
  var dismissed = false;
  function dismiss(){
    if (dismissed) return;
    dismissed = true;
    overlay.style.transition = 'opacity .4s ease';
    overlay.style.opacity = '0';
    setTimeout(function(){ if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 420);
  }
  var vid = document.getElementById('introVideo');
  vid.addEventListener('ended', dismiss);
  vid.addEventListener('error', dismiss);
  document.getElementById('skipIntroBtn').onclick = dismiss;
  var playPromise = vid.play();
  if (playPromise && playPromise.catch) playPromise.catch(function(){ dismiss(); });
  setTimeout(dismiss, 13000);
}

showIntroThenStart();
load();
})();
</script>
